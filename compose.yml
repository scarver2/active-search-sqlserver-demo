# compose.yml
services:
  sqlserver:
    platform: linux/amd64
    build:
      context: docker/sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ActiveSearch-SQL2026!
    ports:
      - "1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ActiveSearch-SQL2026!' -C -Q \"SET NOCOUNT ON; SELECT FULLTEXTSERVICEPROPERTY('IsFullTextInstalled')\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
